[package]
name = "procman"
version = "0.1.0"
edition = "2021"
description = "Windows 原生进程管理器：查看进程、结束进程、按端口反查进程"

[dependencies]
eframe = "0.29"
egui_extras = "0.29"
sysinfo = "0.33"
netstat2 = "0.9"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
]

[dependencies.image]
version = "0.25"
default-features = false
features = ["png"]
optional = true

[features]
# 调试用：设置 PROCMAN_SHOT=<路径> 时会把自己的画面截成 PNG
screenshot = ["dep:image"]

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
